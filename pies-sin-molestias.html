<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Pies Sin Molestias</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Programa de cuidado de los pies en 30 días.">
<meta name="theme-color" content="#E94D91">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pies Sin Molestias">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: app shell centrado, contenido en tarjetas, navegación inferior fija tipo app de bienestar */
:root{
  --pastel:#F7C8D5; --accent:#E94D91; --accent-ink:#C2306F; --cream:#FFF1EA; --white:#FFFFFF;
  --ink:#242126; --muted:#6E6570; --mist:#F4F2F3; --line:#EADFE3;
  --bg:#FFF8F5; --surface:#FFFFFF; --surface-2:#FFF1EA; --on-accent:#FFFFFF;
  --w1:#F7C8D5; --w2:#FFDCC8; --w3:#EFD3E8; --w4:#E94D91; --w4-ink:#FFFFFF; --w-ink:#242126;
  --ok:#2F8F63; --ok-bg:#E3F4EA; --warn:#B4541A; --warn-bg:#FFEBDD; --bad:#C0263A; --bad-bg:#FDE4E7;
  --skin:#FBE3DA; --bone:#FFFFFF; --stroke:#242126; --shadow:0 6px 22px rgba(120,40,75,.10), 0 1px 3px rgba(120,40,75,.08);
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --pastel:#5A3343; --accent:#F0679F; --accent-ink:#FF8DBA; --cream:#2C2228; --white:#FFFFFF;
  --ink:#F7EEF2; --muted:#BFAEB7; --mist:#2A2328; --line:#3D3239;
  --bg:#1B171B; --surface:#241E23; --surface-2:#2C2228; --on-accent:#1B171B;
  --w1:#5A3343; --w2:#5B3B2C; --w3:#4D3449; --w4:#F0679F; --w4-ink:#1B171B; --w-ink:#F7EEF2;
  --ok:#6FD3A0; --ok-bg:#1F3A2C; --warn:#F3A46B; --warn-bg:#3E2A1C; --bad:#FF8A98; --bad-bg:#3F1F25;
  --skin:#4A3A3A; --bone:#E9DDE2; --stroke:#F7EEF2; --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --pastel:#5A3343; --accent:#F0679F; --accent-ink:#FF8DBA; --cream:#2C2228; --white:#FFFFFF;
  --ink:#F7EEF2; --muted:#BFAEB7; --mist:#2A2328; --line:#3D3239;
  --bg:#1B171B; --surface:#241E23; --surface-2:#2C2228; --on-accent:#1B171B;
  --w1:#5A3343; --w2:#5B3B2C; --w3:#4D3449; --w4:#F0679F; --w4-ink:#1B171B; --w-ink:#F7EEF2;
  --ok:#6FD3A0; --ok-bg:#1F3A2C; --warn:#F3A46B; --warn-bg:#3E2A1C; --bad:#FF8A98; --bad-bg:#3F1F25;
  --skin:#4A3A3A; --bone:#E9DDE2; --stroke:#F7EEF2; --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.app{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(110px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:10px;min-height:60px}
.top .brand{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);display:flex;align-items:center;gap:8px}
.top .ttl{font-family:var(--f-display);font-weight:700;font-size:19px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
.spacer{flex:1}
.view{display:flex;flex-direction:column;gap:20px;animation:in .35s ease both}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.nav ul{list-style:none;margin:0 auto;padding:0;max-width:620px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{width:100%;min-height:58px;border:0;background:none;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--muted);text-transform:uppercase}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent-ink);background:color-mix(in srgb,var(--pastel) 55%,transparent)}

/* Tarjetas y elementos */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px}
.soft{background:var(--surface-2);border-radius:var(--r-lg);padding:20px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
.muted{color:var(--muted)}
.small{font-size:15px}
.h2{font-size:clamp(24px,5vw,30px);font-weight:800}
.h3{font-size:20px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.btn{min-height:56px;border-radius:999px;border:0;padding:14px 26px;font-weight:700;font-size:17px;letter-spacing:.04em;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s ease, box-shadow .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line)}
.btn.done{background:var(--ok-bg);color:var(--ok)}
.btn.block{width:100%}
.btn svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--mist);font-size:14px;font-weight:700}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.pink{background:var(--pastel);color:var(--w-ink)}
.tap{border:0;text-align:left;width:100%;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:14px;display:flex;gap:14px;align-items:center;transition:transform .15s}
.tap:hover{transform:translateY(-2px)}
.tap .ill{width:68px;height:68px;flex:none;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.tap .ill svg{width:62px;height:62px}
.tap .ill img{width:100%;height:100%;object-fit:cover}
img.photo{display:block;width:100%;max-width:560px;aspect-ratio:1;object-fit:cover;border-radius:var(--r-lg);background:var(--surface-2);box-shadow:var(--shadow)}
.grid .card img.photo{max-width:none;aspect-ratio:4/3}
.hero .art img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:22px;box-shadow:var(--shadow)}
.tap .txt{min-width:0;flex:1}
.tap .txt b{display:block;font-size:17px;line-height:1.25}
.tap .txt span{display:block;font-size:14.5px;color:var(--muted);margin-top:2px}
.tap .go{flex:none;color:var(--muted)}
.tap .go svg{width:20px;height:20px}
.bar{height:12px;border-radius:999px;background:var(--mist);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .6s ease}
ul.dots{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.dots li{position:relative;padding-left:22px}
ul.dots li::before{content:"";position:absolute;left:4px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--accent)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
ol.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
ol.steps li::before{content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--pastel);color:var(--w-ink);font-weight:700;display:grid;place-items:center;font-size:15px}
.alert{border-radius:var(--r-md);padding:16px;display:flex;gap:12px;align-items:flex-start;background:var(--warn-bg);color:var(--ink)}
.alert svg{width:24px;height:24px;flex:none;color:var(--warn);margin-top:2px}
.alert.red{background:var(--bad-bg)}
.alert.red svg{color:var(--bad)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

/* Hero */
.hero{background:linear-gradient(160deg,var(--pastel),var(--cream) 70%);border-radius:32px;padding:24px;display:grid;gap:12px;grid-template-columns:1fr;position:relative;overflow:hidden;color:var(--w-ink)}
.hero h1{font-size:clamp(36px,9vw,58px);font-weight:800;letter-spacing:-.02em;line-height:.95}
.hero h1 span{color:var(--accent-ink)}
.hero .sub{font-size:18px;max-width:30ch}
.hero .art{justify-self:center;width:100%}
.hero .art svg{width:100%;height:auto;display:block}
@media (min-width:760px){.hero{grid-template-columns:1.2fr 1fr;align-items:center;padding:36px}.hero .art{grid-row:1/4;grid-column:2}}
.feature{background:var(--ink);color:var(--bg);border-radius:var(--r-lg);padding:22px;display:flex;gap:16px;align-items:center}
.feature .num{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:.9;color:var(--accent)}
.ring{width:84px;height:84px;flex:none}

/* Semanas */
.week{border-radius:var(--r-lg);padding:20px;color:var(--w-ink);display:flex;flex-direction:column;gap:14px}
.week.w4{color:var(--w4-ink)}
.week .bar{background:color-mix(in srgb,var(--surface) 55%,transparent)}
.week.w4 .bar i{background:var(--w4-ink)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.day{border:0;min-height:86px;border-radius:16px;background:color-mix(in srgb,var(--surface) 82%,transparent);color:var(--ink);padding:10px 12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;position:relative}
.day small{font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day b{font-size:14.5px;line-height:1.25}
.day.is-done{background:var(--ok-bg)}
.day.is-done small{color:var(--ok)}
.day.is-next{outline:3px solid var(--accent);outline-offset:-3px}
.day .tick{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:var(--bg);display:grid;place-items:center}
.day .tick svg{width:14px;height:14px}

/* Mapa mental */
.mm{display:flex;flex-direction:column;gap:0}
.mm-c{align-self:flex-start;background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-weight:800;font-size:19px;padding:12px 20px;border-radius:999px}
.mm-bs{margin-left:22px;border-left:3px solid var(--pastel);padding:14px 0 4px 0;display:flex;flex-direction:column;gap:12px}
.mm-b{position:relative;margin-left:22px;background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px}
.mm-b::before{content:"";position:absolute;left:-25px;top:22px;width:22px;height:3px;background:var(--pastel)}
.mm-b b{display:block;font-family:var(--f-display);font-size:17px;margin-bottom:6px;color:var(--accent-ink)}
.mm-b .leaves{display:flex;flex-wrap:wrap;gap:6px}
.mm-b .leaves span{background:var(--surface);border-radius:10px;padding:4px 10px;font-size:14.5px}
@media (min-width:760px){.mm-bs{display:grid;grid-template-columns:1fr 1fr}}

/* Ilustraciones */
.illus{background:var(--surface-2);border-radius:var(--r-lg);display:grid;place-items:center;padding:16px}
.illus svg{width:100%;max-width:340px;height:auto;display:block}
.sk{fill:var(--skin);stroke:var(--stroke);stroke-width:2.5;stroke-linejoin:round}
.sk2{fill:var(--pastel);stroke:var(--stroke);stroke-width:2.5}
.bn{fill:var(--bone);stroke:var(--stroke);stroke-width:1.6}
.hl{fill:var(--accent);opacity:.85}
.hlr{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:5 4}
.ln{fill:none;stroke:var(--stroke);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.lnm{fill:none;stroke:var(--muted);stroke-width:1.5}
.ar{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.gr{stroke:var(--muted);stroke-width:2;stroke-dasharray:2 5;stroke-linecap:round}
.tx{fill:var(--ink);font-family:var(--f-body);font-size:13px;font-weight:700}
.txa{fill:var(--accent-ink);font-family:var(--f-display);font-size:20px;font-weight:800}
.obj{fill:var(--pastel);stroke:var(--stroke);stroke-width:2}
.obj2{fill:var(--cream);stroke:var(--stroke);stroke-width:2}
.limb{fill:none;stroke:var(--stroke);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.limbf{fill:none;stroke:var(--skin);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}

/* Formularios */
.scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.scale button{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;padding:0}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:6px 16px;font-weight:700;font-size:15px}
.chips button[aria-pressed="true"]{background:var(--pastel);border-color:var(--accent);color:var(--w-ink)}
.auth{max-width:460px;margin:0 auto;width:100%}
.auth form{display:flex;flex-direction:column;gap:14px}
.auth label{font-weight:700;display:flex;flex-direction:column;gap:6px}
.auth .err{background:var(--bad-bg);color:var(--ink);border-radius:14px;padding:12px}
.auth .msg{background:var(--ok-bg);color:var(--ink);border-radius:14px;padding:12px}
.linkbtn{border:0;background:none;color:var(--accent-ink);font-weight:700;text-decoration:underline;padding:8px;min-height:44px}
textarea,input[type=text],input[type=email],input[type=password]{min-height:52px;width:100%;font:inherit;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:12px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--accent);flex:none;margin-top:1px}
.check:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--pastel) 35%,var(--surface))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:16px}
.stat b{display:block;font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal button{aspect-ratio:1;max-width:100%;border:0;border-radius:12px;font-weight:700;font-size:15px;color:var(--w-ink);font-variant-numeric:tabular-nums;padding:0}
.cal button.d{background:var(--ok)!important;color:var(--bg)}
.log{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.log:last-child{border-bottom:0}
.log .lv{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);font-size:20px;flex:none}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare .c{border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:8px}
.compare .c.good{background:var(--ok-bg)}
.compare .c.bad{background:var(--bad-bg)}
.compare .c svg{width:100%;height:auto;max-height:200px}
.compare .lbl{font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.compare .good .lbl{color:var(--ok)}
.compare .bad .lbl{color:var(--bad)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs button{flex:none;min-height:44px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:6px 16px;font-weight:700;font-size:15px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.myth{border-radius:var(--r-md);padding:14px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.tag{align-self:flex-start;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.tag.m{background:var(--bad-bg);color:var(--bad)}
.tag.v{background:var(--ok-bg);color:var(--ok)}
.tag.d{background:var(--warn-bg);color:var(--warn)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(36,33,38,.55);display:grid;place-items:end center;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.modal .sheet{background:var(--surface);border-radius:28px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px;animation:in .3s ease}
@media (min-width:760px){.modal{place-items:center}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
table.print{width:100%;border-collapse:collapse;font-size:14px}
table.print th,table.print td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
table.print th{background:var(--surface-2)}
.tw{overflow-x:auto}
@media print{
  .nav,.top,.noprint,body::before{display:none!important}
  body{background:#fff;color:#000;font-size:12px}
  .app{padding:0}
  .card{box-shadow:none}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E94D91"/>
    </marker>
  </defs>
</svg>

<div class="app">
  <header class="top" id="top"></header>
  <main id="main" tabindex="-1"></main>
</div>
<nav class="nav" aria-label="Navegación principal"><ul id="nav"></ul></nav>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

let USER = null, syncT = null, syncState = "ok";
const storeKey = () => USER ? `${KEY}:${USER.id}` : KEY;
function loadLocal(k=storeKey()){ try{ const raw = localStorage.getItem(k); return raw ? Object.assign(blank(), JSON.parse(raw)) : null; }catch(e){ return null; } }
function save(){
  try{ localStorage.setItem(storeKey(), JSON.stringify(S)); }catch(e){}
  if(USER){ clearTimeout(syncT); syncState="saving"; updSync(); syncT = setTimeout(pushRemote, 800); }
}
async function pushRemote(){
  try{
    const { error } = await sb.from("progress").upsert({ user_id: USER.id, data: S, updated_at: new Date().toISOString() });
    syncState = error ? "error" : "ok";
  }catch(e){ syncState = "error"; }
  updSync();
}
async function pullRemote(){
  const { data, error } = await sb.from("progress").select("data").eq("user_id", USER.id).maybeSingle();
  if(error) throw error;
  if(data && data.data && Object.keys(data.data).length){ S = Object.assign(blank(), data.data); }
  else { S = loadLocal() || loadLocal(KEY) || blank(); await pushRemote(); }
  try{ localStorage.setItem(storeKey(), JSON.stringify(S)); }catch(e){}
}

let stack = [];
let cur = {v:"home",p:null};

function go(v,p=null,push=true){
  if(push && !TABS.some(t=>t[0]===v)) stack.push(cur); else if(TABS.some(t=>t[0]===v)) stack=[];
  cur = {v,p};
  if(["day","exercise","topic"].includes(v)){ S.last={v,p}; save(); }
  render();
  window.scrollTo({top:0});
}
function back(){ const prev = stack.pop(); if(prev){ cur=prev; render(); window.scrollTo({top:0}); } else go("home"); }

/* =========================================================
   RENDER Y EVENTOS

const TITLES = {day:p=>`Día ${p}`,exercise:p=>exById(p)?.n,topic:p=>TOPICS.find(t=>t.id===p)?.t,problems:()=>"¿Qué problema tenés?",problem:p=>CONDS.find(c=>c.id===p)?.t,shoes:()=>"Guía de calzado",treatments:()=>"Tratamientos",bonus:()=>"Bonos",calendar:()=>"Calendario de 30 días",safety:()=>"Seguridad",terminos:()=>"Términos de uso",privacidad:()=>"Privacidad"};
/* Pantallas de acceso */
let authMode = "login", authMsg = "", authErr = "";
const AUTH_ERR = [[/invalid login/i,"Email o contraseña incorrectos."],[/already registered|already exists/i,"Ya existe una cuenta con ese email. Iniciá sesión."],[/not confirmed/i,"Confirmá tu email con el enlace que te enviamos."],[/at least 6|password should/i,"La contraseña debe tener al menos 6 caracteres."],[/rate limit|too many/i,"Demasiados intentos. Esperá unos minutos y probá de nuevo."],[/signups not allowed|signup.*disabled/i,"El registro está cerrado. Ingresá con el email de tu compra."]];
const authError = e => (AUTH_ERR.find(([r])=>r.test(e?.message||""))||[0,"No pudimos completar la operación. Revisá tu conexión e intentá de nuevo."])[1];
function renderAuth(){
  document.querySelector(".nav").hidden = true;
  document.getElementById("modal").innerHTML = "";
  document.getElementById("top").innerHTML = `<div class="brand">${I.foot.replace('<svg','<svg width="22" height="22"')}Pies sin molestias</div>`;
  const T = {
    login:["Ingresá a tu programa","Usá el email y la contraseña de tu cuenta.","INGRESAR"],
    signup:["Creá tu cuenta","Tu progreso queda guardado y lo ves desde cualquier dispositivo.","CREAR MI CUENTA"],
    forgot:["Recuperá tu contraseña","Te enviamos un enlace a tu email para crear una nueva.","ENVIAR ENLACE"],
    newpass:["Elegí una contraseña nueva","Usá al menos 6 caracteres.","GUARDAR CONTRASEÑA"]
  }[authMode];
  document.getElementById("main").innerHTML = `<div class="view auth">
    <section class="hero" style="grid-template-columns:1fr"><h1 style="font-size:clamp(34px,9vw,46px)">Pies <span>sin</span> molestias</h1><p class="sub">Cuidá tus pies, recuperá comodidad en cada paso.</p></section>
    <section class="card stack"><h2 class="h2">${T[0]}</h2><p class="muted">${T[1]}</p>
      ${authErr?`<p class="err" role="alert">${esc(authErr)}</p>`:""}${authMsg?`<p class="msg" role="status">${esc(authMsg)}</p>`:""}
      <form id="authform" novalidate>
        ${authMode==="signup"?`<label for="a-name">Tu nombre<input type="text" id="a-name" autocomplete="given-name" required></label>`:""}
        ${authMode!=="newpass"?`<label for="a-email">Email<input type="email" id="a-email" autocomplete="email" inputmode="email" required></label>`:""}
        ${authMode!=="forgot"?`<label for="a-pass">Contraseña<input type="password" id="a-pass" autocomplete="${authMode==="login"?"current-password":"new-password"}" minlength="6" required></label>`:""}
        ${authMode==="signup"?`<label class="check" for="a-consent" style="font-weight:400;flex-direction:row"><input type="checkbox" id="a-consent" required><span class="small">Acepto los <button type="button" class="linkbtn" data-act="authlegal" data-p="terminos" style="min-height:0;padding:0">Términos de uso</button> y la <button type="button" class="linkbtn" data-act="authlegal" data-p="privacidad" style="min-height:0;padding:0">Política de privacidad</button>, y doy mi consentimiento para que se guarden los datos de salud que registre.</span></label>`:""}
        <button class="btn primary block" type="submit" id="a-submit">${T[2]}</button>
      </form>
      <div class="stack" style="gap:2px;align-items:center">
        ${authMode==="login"?`<button class="linkbtn" data-auth="forgot">Olvidé mi contraseña</button>${ALLOW_SIGNUP?`<button class="linkbtn" data-auth="signup">No tengo cuenta: crear una</button>`:""}`:""}
        ${authMode==="signup"||authMode==="forgot"?`<button class="linkbtn" data-auth="login">Ya tengo cuenta: ingresar</button>`:""}
      </div>
      <p class="small muted" style="text-align:center"><button class="linkbtn" data-act="authlegal" data-p="terminos" style="min-height:0;padding:0 4px">Términos de uso</button> · <button class="linkbtn" data-act="authlegal" data-p="privacidad" style="min-height:0;padding:0 4px">Privacidad</button></p>
    </section></div>`;
}
async function submitAuth(){
  const v = id => document.getElementById(id)?.value.trim() || "";
  const email = v("a-email"), pass = document.getElementById("a-pass")?.value || "", name = v("a-name");
  authErr = ""; authMsg = "";
  if(authMode!=="newpass" && !/^\S+@\S+\.\S+$/.test(email)){ authErr="Escribí un email válido."; return renderAuth(); }
  if(authMode!=="forgot" && pass.length<6){ authErr="La contraseña debe tener al menos 6 caracteres."; return renderAuth(); }
  if(authMode==="signup" && !name){ authErr="Escribí tu nombre."; return renderAuth(); }
  if(authMode==="signup" && !document.getElementById("a-consent")?.checked){ authErr="Para crear tu cuenta tenés que aceptar los términos y la política de privacidad."; return renderAuth(); }
  const btn = document.getElementById("a-submit"); btn.disabled = true; btn.textContent = "Un momento…";
  const back = location.origin + location.pathname;
  try{
    if(authMode==="login"){ const {data,error}=await sb.auth.signInWithPassword({email,password:pass}); if(error) throw error; return enter(data.user); }
    if(authMode==="signup"){ const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{name},emailRedirectTo:back}}); if(error) throw error;
      if(data.session) return enter(data.user); authMode="login"; authMsg="Te enviamos un email para confirmar tu cuenta. Abrí el enlace y después ingresá."; return renderAuth(); }
    if(authMode==="forgot"){ const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:back}); if(error) throw error; authMode="login"; authMsg="Si el email tiene una cuenta, te llegó un enlace para crear una contraseña nueva."; return renderAuth(); }
    if(authMode==="newpass"){ const {data,error}=await sb.auth.updateUser({password:pass}); if(error) throw error; history.replaceState(null,"",location.pathname); toast("Contraseña actualizada"); return enter(data.user); }
  }catch(e){ authErr = authError(e); renderAuth(); }
}
async function enter(user){
  USER = user;
  document.getElementById("main").innerHTML = `<div class="view"><p class="muted">Cargando tu programa…</p></div>`;
  try{ await pullRemote(); syncState="ok"; }catch(e){ S = loadLocal() || blank(); syncState="error"; }
  start();
}
async function logout(){
  try{ clearTimeout(syncT); if(syncState==="saving") await pushRemote(); await sb.auth.signOut(); }catch(e){}
  USER = null; S = blank(); stack = []; cur = {v:"home",p:null}; authMode="login"; authMsg="Cerraste sesión."; authErr=""; renderAuth();
}
function start(){
  document.querySelector(".nav").hidden = false;
  render();
  if(!S.ack) showAck();
}

function render(){
  const m = document.getElementById("main");
  renderTop(TITLES[cur.v]?.(cur.p));
  renderNav();
  m.innerHTML = `<div class="view">${V[cur.v](cur.p)}</div>`;
  if(cur.v==="progress" && cur.p==="log") setTimeout(()=>document.getElementById("log")?.scrollIntoView({behavior:"smooth"}),50);
}

const BENEFITS = ["Un programa guiado de 30 días, paso a paso","15 ejercicios ilustrados y fáciles de seguir","Aprendés a elegir calzado más cómodo","Entendés qué les pasa a tus pies, con explicaciones simples","Seguís tu progreso día a día","Terminás con tu propio plan de cuidado"];
function showAck(){
  document.getElementById("modal").innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="ackt"><div class="sheet">
    <div class="eyebrow">Bienvenida</div><h2 class="h2" id="ackt">${userName()?`¡Hola, ${esc(userName())}! `:""}Te damos la bienvenida a Pies sin molestias</h2>
    <p>Esto es lo que vas a tener:</p>
    <ul class="dots" style="font-size:18px">${BENEFITS.map(b=>`<li>${b}</li>`).join("")}</ul>
    <button class="btn primary block" data-act="ack">EMPEZAR</button></div></div>`;
}

document.addEventListener("click", ev=>{
  const b = ev.target.closest("button"); if(!b) return;
  if(b.dataset.auth){ authMode=b.dataset.auth; authErr=""; authMsg=""; renderAuth(); return; }
  if(b.dataset.act==="authlegal"){ ev.preventDefault(); document.getElementById("main").innerHTML = `<div class="view">${legalView(b.dataset.p).replace(/<button class="btn ghost" data-go[^]*$/,"")}<button class="btn primary" data-act="authback">${I.back} Volver</button></div>`; window.scrollTo({top:0}); return; }
  if(b.dataset.act==="authback"){ renderAuth(); window.scrollTo({top:0}); return; }
  if(b.closest("form")) return;
  if(b.dataset.go){ if(b.dataset.replace){ cur={v:b.dataset.go,p:b.dataset.p}; if(["day","exercise","topic"].includes(cur.v)){S.last={...cur};save();} render(); window.scrollTo({top:0}); return; } go(b.dataset.go, b.dataset.p ?? null); return; }
  if(b.dataset.filter){ exFilter=b.dataset.filter; render(); return; }
  if(b.dataset.lv!=null){ logLevel=+b.dataset.lv; document.querySelectorAll("#scale button").forEach(x=>x.setAttribute("aria-pressed", +x.dataset.lv===logLevel)); return; }
  if(b.dataset.zone){ const z=b.dataset.zone; logZones.has(z)?logZones.delete(z):logZones.add(z); b.setAttribute("aria-pressed",logZones.has(z)); return; }
  if(b.dataset.freq){ document.querySelectorAll("#freq button").forEach(x=>x.setAttribute("aria-pressed", x===b)); return; }
  const a = b.dataset.act;
  if(a==="back") back();
  else if(a==="ack"){ S.ack=true; save(); document.getElementById("modal").innerHTML=""; }
  else if(a==="start"){ S.started=today(); save(); go("day",1); }
  else if(a==="continue"){ doneCount()===30 && S.plan ? go("progress") : go("day", nextDay()); }
  else if(a==="toggleday"){ const n=b.dataset.p; if(!S.started) S.started=today(); if(S.done[n]) delete S.done[n]; else S.done[n]=today(); save(); render(); toast(S.done[n]?`Día ${n} completado`:`Día ${n} marcado como pendiente`); }
  else if(a==="exdone"){ const id=b.dataset.p; S.ex[id]=(S.ex[id]||0)+1; S.exLog.push({id,d:today()}); save(); render(); toast("Ejercicio registrado"); }
  else if(a==="savelog"){
    if(logLevel===null){ toast("Elegí un número del 0 al 10"); return; }
    S.logs.push({d:today(),v:logLevel,z:[...logZones],n:document.getElementById("lognote").value.trim()}); save();
    logLevel=null; logZones=new Set(); render(); toast("Registro guardado");
  }
  else if(a==="saveplan"){
    const ex=[...document.querySelectorAll("[data-plan]:checked")].map(x=>x.dataset.plan);
    if(!ex.length){ toast("Elegí al menos un ejercicio"); return; }
    const f=document.querySelector('#freq button[aria-pressed="true"]')?.dataset.freq||"5 veces por semana";
    S.plan={ex,freq:f,d:today()}; save(); toast("Plan guardado en Mi progreso");
  }
  else if(a==="askreset"){ document.getElementById("resetbox").innerHTML=`<div class="alert red">${I.alert}<div class="stack"><b>¿Borrar todo tu progreso?</b><p class="small">Se eliminan días completados, ejercicios, registros de molestia y tu plan${USER?", también de tu cuenta":""}. No se puede deshacer.</p><div class="grid2"><button class="btn ghost" data-act="noreset">Cancelar</button><button class="btn primary" data-act="doreset">Borrar</button></div></div></div>`; }
  else if(a==="noreset") render();
  else if(a==="doreset"){ S=Object.assign(blank(),{ack:true}); save(); render(); toast("Progreso reiniciado"); }
  else if(a==="print"){ try{ window.print(); }catch(e){} }
  else if(a==="logout") logout();
  else if(a==="install" && installEvt){ installEvt.prompt(); installEvt.userChoice.finally(()=>{ installEvt=null; render(); }); }
});
document.addEventListener("submit", ev=>{ if(ev.target.id==="authform"){ ev.preventDefault(); submitAuth(); } });
document.addEventListener("change", ev=>{
  const t = ev.target;
  if(t.dataset.habit){ const k=t.dataset.habit; S.checks[k]=S.checks[k]||{}; S.checks[k][t.dataset.i]=t.checked; save();
    const c=HABITS.filter((_,i)=>S.checks[k][i]).length; const el=document.getElementById("habit-sum"); if(el) el.textContent=`${c} de ${HABITS.length} hábitos incorporados`; }
  if(t.dataset.shoe!=null){ S.shoeCheck[t.dataset.shoe]=t.checked; save(); const c=SHOE_CHECK.filter((_,i)=>S.shoeCheck[i]).length; const el=document.getElementById("shoe-sum"); if(el) el.textContent=`${c} de ${SHOE_CHECK.length} criterios`; }
});

const h = (location.hash||"").slice(1);
if(TAB_HASH[h]) cur={v:TAB_HASH[h],p:null};
(async function boot(){
  if(!CLOUD){ start(); return; }
  const recovering = /type=recovery/.test(location.hash);
  document.querySelector(".nav").hidden = true;
  document.getElementById("main").innerHTML = `<div class="view"><p class="muted">Cargando…</p></div>`;
  sb.auth.onAuthStateChange((ev, session)=>{
    if(ev==="PASSWORD_RECOVERY"){ authMode="newpass"; authErr=""; authMsg=""; setTimeout(renderAuth); }
    else if(ev==="SIGNED_OUT" && USER){ USER=null; S=blank(); setTimeout(renderAuth); }
  });
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(recovering){ authMode="newpass"; renderAuth(); }
    else if(session) enter(session.user);
    else renderAuth();
  }catch(e){ authErr="No pudimos conectar. Revisá tu conexión e intentá de nuevo."; renderAuth(); }
})();
</script>
